<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 测试场 — 掼蛋</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/arena.css">
</head>
<body>

<div id="arena-app">
  <div id="arena-header">
    <h1>AI 测试场</h1>
    <a href="/">主菜单</a> <a href="/game">对战</a> <a href="/eval">评估实验室</a>
    <div id="arena-tabs">
      <button class="atab on" onclick="switchTab('custom')">自定义</button>
      <button class="atab" onclick="switchTab('perfect')">确定推演</button>
      <button class="atab" onclick="switchTab('table')">真实牌桌</button>
    </div>
    <span style="flex:1"></span>
    <button class="btn btn-gy btn-sm" id="btn-dbg2" style="display:none" onclick="toggleDebugT()">Debug</button>
  </div>

  <!-- ================================================================
       TAB: 完全信息
       ================================================================ -->
  <!-- ================================================================
       TAB: 自定义
       ================================================================ -->
  <div class="arena-row on" id="row-custom">
    <div class="aside" id="aside-cl" style="width:340px">
      <div class="sect"><h3>牌池 <span id="pool-stats" style="font-weight:normal;font-size:0.75em;color:#888"></span></h3>
        <div class="pool-acts" style="display:flex;gap:3px;margin-bottom:4px;flex-wrap:wrap">
          <button class="btn btn-g btn-sm" onclick="customRandomDeal()">随机每人27张</button>
          <button class="btn btn-gy btn-sm" onclick="customDealRemaining()">分配剩余牌</button>
          <button class="btn btn-gy btn-sm" onclick="customClear()">清空手牌</button>
        </div>
        <div class="scroll-list" id="card-pool" style="max-height:calc(100vh - 280px)"></div>
      </div>
      <div class="sect"><h3>模型</h3><div id="profs-c"></div>
        <div style="display:flex;gap:3px;margin-top:3px"><button class="btn btn-gn" onclick="customStart()" id="btn-ac">开始推演</button></div>
      </div>
    </div>

    <div class="resize-handle" id="rh-cl" data-target="aside-cl" data-side="right"></div>

	    <div class="arena-tbl custom-tbl" id="tbl-c">
      <div id="custom-builder" onclick="customClearFocus(event)">
        <div class="player-zone you" id="cz-0" onclick="customFocus(0, event)">
          <div class="zone-header"><span class="name you">你</span><span class="cz-cnt" id="czcnt-0">0张</span></div>
          <div class="ahc cz-hand" id="czhand-0"></div>
        </div>
        <div class="player-zone right" id="cz-1" onclick="customFocus(1, event)">
          <div class="zone-header"><span class="name">右家</span><span class="cz-cnt" id="czcnt-1">0张</span></div>
          <div class="ahc cz-hand" id="czhand-1"></div>
        </div>
        <div class="player-zone partner" id="cz-2" onclick="customFocus(2, event)">
          <div class="zone-header"><span class="name">对家</span><span class="cz-cnt" id="czcnt-2">0张</span></div>
          <div class="ahc cz-hand" id="czhand-2"></div>
        </div>
        <div class="player-zone left" id="cz-3" onclick="customFocus(3, event)">
          <div class="zone-header"><span class="name">左家</span><span class="cz-cnt" id="czcnt-3">0张</span></div>
          <div class="ahc cz-hand" id="czhand-3"></div>
        </div>

        <!-- Play areas (between zones and center) -->
        <div class="cz-play-area you" id="czpa-0" onclick="customFocusPlay(0, event)">
          <button class="czpa-btn czpa-play active" id="czpa-play-0" onclick="event.stopPropagation();czSetPlay(0,'play')">出牌</button>
          <button class="czpa-btn czpa-pass" id="czpa-pass-0" onclick="event.stopPropagation();czSetPlay(0,'pass')">过</button>
          <button class="czpa-btn czpa-turn" id="czpa-turn-0" onclick="event.stopPropagation();czSetPlay(0,'turn')">轮到</button>
          <span class="cz-pcards" id="czpcard-0"></span>
        </div>
        <div class="cz-play-area right" id="czpa-1" onclick="customFocusPlay(1, event)">
          <button class="czpa-btn czpa-play" id="czpa-play-1" onclick="event.stopPropagation();czSetPlay(1,'play')">出牌</button>
          <button class="czpa-btn czpa-pass" id="czpa-pass-1" onclick="event.stopPropagation();czSetPlay(1,'pass')">过</button>
          <button class="czpa-btn czpa-turn" id="czpa-turn-1" onclick="event.stopPropagation();czSetPlay(1,'turn')">轮到</button>
          <span class="cz-pcards" id="czpcard-1"></span>
        </div>
        <div class="cz-play-area partner" id="czpa-2" onclick="customFocusPlay(2, event)">
          <button class="czpa-btn czpa-play" id="czpa-play-2" onclick="event.stopPropagation();czSetPlay(2,'play')">出牌</button>
          <button class="czpa-btn czpa-pass" id="czpa-pass-2" onclick="event.stopPropagation();czSetPlay(2,'pass')">过</button>
          <button class="czpa-btn czpa-turn" id="czpa-turn-2" onclick="event.stopPropagation();czSetPlay(2,'turn')">轮到</button>
          <span class="cz-pcards" id="czpcard-2"></span>
        </div>
        <div class="cz-play-area left" id="czpa-3" onclick="customFocusPlay(3, event)">
          <button class="czpa-btn czpa-play" id="czpa-play-3" onclick="event.stopPropagation();czSetPlay(3,'play')">出牌</button>
          <button class="czpa-btn czpa-pass" id="czpa-pass-3" onclick="event.stopPropagation();czSetPlay(3,'pass')">过</button>
          <button class="czpa-btn czpa-turn" id="czpa-turn-3" onclick="event.stopPropagation();czSetPlay(3,'turn')">轮到</button>
          <span class="cz-pcards" id="czpcard-3"></span>
        </div>

        <div class="tbl-ctr">
          <div style="background:rgba(0,0,0,0.3);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:0.78em">
            <span style="color:#aaa">级牌</span>
            <div style="display:flex;align-items:center;gap:4px">
              <button class="btn btn-gy btn-sm" style="font-size:0.7em;padding:1px 5px;width:22px" onclick="setLevel(Math.max(2,C.level-1))">-</button>
              <span id="custom-level" style="color:#daa520;font-weight:bold;min-width:20px;text-align:center">2</span>
              <button class="btn btn-gy btn-sm" style="font-size:0.7em;padding:1px 5px;width:22px" onclick="setLevel(Math.min(14,C.level+1))">+</button>
            </div>
            <span id="cz-valid" style="font-size:0.73em"></span>
            <button class="btn btn-gy btn-sm" style="font-size:0.7em;padding:1px 5px" onclick="undoAction()">撤销</button>
              <button class="btn btn-gy btn-sm" style="font-size:0.7em;padding:1px 5px" onclick="customClearTrick()">清空牌桌</button>
          </div>
        </div>
      </div>
    </div>

    <div class="resize-handle" id="rh-cr" data-target="aside-cr" data-side="left"></div>

	    <div class="aside" id="aside-cr" style="width:340px">
      <div class="sect"><h3>结果 <span id="crcnt" style="color:#888;font-size:0.76em"></span></h3><div id="cres"></div></div>
    </div>
  </div>

  <!-- ================================================================
       TAB: 完全信息
       ================================================================ -->
  <div class="arena-row" id="row-perfect">
    <div class="aside" id="aside-pl" style="width:260px">
      <div class="sect"><h3>场景</h3>
        <select id="pcat" onchange="loadScP()" style="background:#222;color:#ddd;border:1px solid #444;padding:1px 5px;border-radius:3px;font-size:0.76em;width:100%;margin-bottom:2px"></select>
        <div class="scroll-list" id="sc-list"></div>
      </div>
      <div class="sect"><h3>模型</h3><div id="profs-p"></div>
        <div style="display:flex;gap:3px;margin-top:3px"><button class="btn btn-gn btn-sm" onclick="runP()" id="btn-ap">分析</button></div>
      </div>
    </div>
    <div class="resize-handle" id="rh-pl" data-target="aside-pl" data-side="right"></div>

    <div class="arena-tbl" id="tbl-p">
      <div class="cz-play-area you" id="ppa-0"><span class="cz-pcards" id="ppcard-0"></span></div>
      <div class="cz-play-area right" id="ppa-1"><span class="cz-pcards" id="ppcard-1"></span></div>
      <div class="cz-play-area partner" id="ppa-2"><span class="cz-pcards" id="ppcard-2"></span></div>
      <div class="cz-play-area left" id="ppa-3"><span class="cz-pcards" id="ppcard-3"></span></div>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;font-size:0.85em">选择场景开始</div></div>

    <div class="resize-handle" id="rh-pr" data-target="aside-pr" data-side="left"></div>
    <div class="aside" id="aside-pr" style="width:340px">
      <div class="sect"><h3>结果 <span id="prcnt" style="color:#888;font-size:0.76em"></span></h3><div id="pres"></div></div>
      <div class="sect"><div class="dbg-sect"><div class="dbg-ttl" onclick="this.parentElement.classList.toggle('open')">▸ 场景详情</div><div class="dbg-body" id="dbg-sc-p"></div></div></div>
    </div>
  </div>

  <!-- ================================================================
       TAB: 真实牌桌
       ================================================================ -->
  <div class="arena-row" id="row-table">
    <div class="aside" id="aside-tl" style="width:260px">
      <div class="sect"><h3>场景</h3>
        <select id="tcat" onchange="loadScT()" style="background:#222;color:#ddd;border:1px solid #444;padding:1px 5px;border-radius:3px;font-size:0.76em;width:100%;margin-bottom:2px"></select>
        <div class="scroll-list" id="sc-list2"></div>
      </div>
      <div class="sect"><h3>模型</h3><div id="profs-t"></div>
        <div style="display:flex;gap:3px;margin-top:3px"><button class="btn btn-gn btn-sm" onclick="runT()" id="btn-at">分析</button><button class="btn btn-g btn-sm" onclick="benchT()" id="btn-bt">基准</button></div>
      </div>
      <div class="sect" id="bsect" style="display:none"><h3>基准</h3><div id="bsum"></div><div id="bdet" style="max-height:150px;overflow-y:auto;font-size:0.7em"></div></div>
    </div>
    <div class="resize-handle" id="rh-tl" data-target="aside-tl" data-side="right"></div>

    <div class="arena-tbl" id="tbl-t">
      <div class="cz-play-area you" id="tpa-0"><span class="cz-pcards" id="tpcard-0"></span></div>
      <div class="cz-play-area right" id="tpa-1"><span class="cz-pcards" id="tpcard-1"></span></div>
      <div class="cz-play-area partner" id="tpa-2"><span class="cz-pcards" id="tpcard-2"></span></div>
      <div class="cz-play-area left" id="tpa-3"><span class="cz-pcards" id="tpcard-3"></span></div>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;font-size:0.85em">选择场景开始</div></div>

    <div class="resize-handle" id="rh-tr" data-target="aside-tr" data-side="left"></div>
    <div class="aside" id="aside-tr" style="width:340px">
      <div class="sect"><h3>视角</h3><div id="persp-tabs"></div><div id="persp-info" style="font-size:0.7em;color:#888;margin-bottom:3px"></div></div>
      <div class="sect"><h3>结果 <span id="trcnt" style="color:#888;font-size:0.76em"></span></h3><div id="tres"></div></div>
      <div class="sect">
        <div class="dbg-sect"><div class="dbg-ttl" onclick="this.parentElement.classList.toggle('open')">▸ 场景详情</div><div class="dbg-body" id="dbg-sc"></div></div>
        <div class="dbg-sect"><div class="dbg-ttl" onclick="this.parentElement.classList.toggle('open')">▸ AI日志</div><div class="dbg-body" id="dbg-ai"></div></div>
        <div class="dbg-sect"><div class="dbg-ttl" onclick="this.parentElement.classList.toggle('open')">▸ 未知牌</div><div class="dbg-body" id="dbg-uk"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Model info floating panel -->
<div class="modal-overlay" id="mdl-overlay" onclick="if(event.target===this)closeModelPanel()">
  <div class="modal-panel" id="mdl-panel"></div>
</div>

<script src="/static/arena.js"></script>
</body>
</html>
