<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掼蛋 Guandan</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app">
  <!-- Header -->
  <div id="header">
    <div style="display:flex;align-items:center;gap:8px">
      <h1 style="font-size:1.2em">掼蛋</h1>
      <a href="/" style="color:#7fb3d5;font-size:0.75em;text-decoration:none">主菜单</a>
      <a href="/arena" style="color:#7fb3d5;font-size:0.75em;text-decoration:none">测试场</a>
      <a href="/eval" style="color:#7fb3d5;font-size:0.75em;text-decoration:none">评估</a>
      <button id="btn-winrate" onclick="toggleWinRate()" style="background:#555;color:#999;border:none;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:0.7em">胜率</button>
    </div>
    <div id="game-info">
      <span class="badge">Lv <strong id="info-level">2</strong></span>
      <span class="badge">局 <strong id="info-round">1</strong></span>
      <span class="badge">轮 <strong id="info-trick">1</strong></span>
      <span class="badge team0">我方 Lv<strong id="info-team0">2</strong></span>
      <span class="badge team1">对方 Lv<strong id="info-team1">2</strong></span>
      <button id="btn-debug" onclick="toggleDebug()">隐藏牌面</button>
      <button id="btn-llm-think" onclick="toggleLLMBubbles()" style="background:#9b59b6;color:#fff">LLM思考</button>
      <button id="btn-ai-debug" onclick="toggleAIDebug()">AI日志</button>
      <button id="btn-config" onclick="toggleConfig()" style="background:#444;color:#fff">AI设置</button>
    </div>
  </div>

  <!-- Table -->
  <div id="table">
    <!-- Partner (top) -->
    <div class="player-zone partner" id="zone-2">
      <div class="zone-header">
        <span class="decider-badge" id="decider-2" title="">?</span>
        <span class="name" id="name-2">对家</span>
        <span class="hand-size" id="size-2">27</span>张
        <span class="finished-tag" id="finish-2" style="display:none">已完成</span>
      </div>
      <div class="zone-body">
        <div class="play-display" id="play-2"></div>
        <div class="debug-cards-inline" id="debug-hand-2" style="display:none"></div>
        <div class="llm-bubble partner" id="llm-bubble-2" style="display:none"></div>
      </div>
    </div>

    <!-- Left player -->
    <div class="player-zone left" id="zone-3">
      <div class="zone-header">
        <span class="decider-badge" id="decider-3" title="">?</span>
        <span class="name" id="name-3">左家</span>
        <span class="hand-size" id="size-3">27</span>张
        <span class="finished-tag" id="finish-3" style="display:none">已完成</span>
      </div>
      <div class="zone-body">
        <div class="play-display" id="play-3"></div>
        <div class="debug-cards-inline" id="debug-hand-3" style="display:none"></div>
        <div class="llm-bubble left" id="llm-bubble-3" style="display:none"></div>
      </div>
    </div>

    <!-- Right player -->
    <div class="player-zone right" id="zone-1">
      <div class="zone-header">
        <span class="decider-badge" id="decider-1" title="">?</span>
        <span class="name" id="name-1">右家</span>
        <span class="hand-size" id="size-1">27</span>张
        <span class="finished-tag" id="finish-1" style="display:none">已完成</span>
      </div>
      <div class="zone-body">
        <div class="play-display" id="play-1"></div>
        <div class="debug-cards-inline" id="debug-hand-1" style="display:none"></div>
        <div class="llm-bubble right" id="llm-bubble-1" style="display:none"></div>
      </div>
    </div>

    <!-- Table center -->
    <div id="table-center">
      <div id="center-combo">
        <span id="center-empty">等待出牌</span>
      </div>
      <div id="center-player"></div>
    </div>

    <!-- Human (bottom) -->
    <div class="player-zone you" id="zone-0">
      <div class="zone-header">
        <span class="decider-badge human" id="decider-0" title="">?</span>
        <span class="name you" id="name-0">你</span>
        <span class="hand-size" id="size-0">27</span>张
        <span class="finished-tag" id="finish-0" style="display:none">已完成</span>
      </div>
      <div class="play-display" id="play-0"></div>
      <div id="my-hand-area">
        <div id="my-hand"></div>
        <div id="combo-strips"></div>
      </div>
    </div>
  </div>

  <!-- AI Config Sidebar -->
  <div id="config-panel" style="display:none;position:fixed;top:0;left:0;bottom:0;width:380px;max-width:95vw;background:#1a1a2e;color:#ccc;z-index:200;overflow-y:auto;font-size:0.85em;border-right:2px solid #333;box-shadow:4px 0 20px rgba(0,0,0,0.5)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <h3 style="color:#daa520;font-size:1em;flex:1">AI 模型设置</h3>
      <button id="btn-config-apply" onclick="applyConfig()" style="background:#27ae60;color:#fff;border:none;padding:4px 16px;border-radius:5px;cursor:pointer;font-size:0.9em">应用</button>
      <button onclick="toggleConfig()" style="background:#555;color:#fff;border:none;padding:4px 12px;border-radius:5px;cursor:pointer">X</button>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap">
      <button class="cfg-tab active" onclick="switchConfigTab('global')" id="cfg-tab-global">全局</button>
      <button class="cfg-tab" onclick="switchConfigTab('p0')" id="cfg-tab-p0">你</button>
      <button class="cfg-tab" onclick="switchConfigTab('p1')" id="cfg-tab-p1">右家</button>
      <button class="cfg-tab" onclick="switchConfigTab('p2')" id="cfg-tab-p2">对家</button>
      <button class="cfg-tab" onclick="switchConfigTab('p3')" id="cfg-tab-p3">左家</button>
    </div>

    <!-- Tab contents: global + 4 players -->
    <div id="cfg-tabcontent-global" style="max-height:340px;overflow-y:auto"></div>
    <div id="cfg-tabcontent-p0" style="display:none;max-height:340px;overflow-y:auto"></div>
    <div id="cfg-tabcontent-p1" style="display:none;max-height:340px;overflow-y:auto"></div>
    <div id="cfg-tabcontent-p2" style="display:none;max-height:340px;overflow-y:auto"></div>
    <div id="cfg-tabcontent-p3" style="display:none;max-height:340px;overflow-y:auto"></div>
  </div>

  <style>
    .cfg-tab { background:#333; color:#999; border:none; padding:4px 14px; border-radius:5px 5px 0 0; cursor:pointer; font-size:0.85em }
    .cfg-tab.active { background:#555; color:#fff }
    
  </style>

  <!-- Suggestion Panel -->
  <div id="suggest-panel" style="display:none;background:rgba(255,255,255,0.04);border-radius:8px;padding:8px;margin:4px 0">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <span style="color:#daa520;font-size:0.85em;flex:1">AI 建议</span>
      <button onclick="document.getElementById('suggest-panel').style.display='none'" style="background:#555;color:#fff;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:0.75em">关闭</button>
    </div>
    <div id="suggest-content" style="font-size:0.8em;max-height:200px;overflow-y:auto"></div>
  </div>

  <!-- Start Game Overlay -->
  <div id="start-overlay" style="text-align:center;padding:20px">
    <button id="btn-start-game" onclick="startGame()" style="background:#27ae60;color:#fff;border:none;padding:14px 40px;border-radius:10px;font-size:1.2em;cursor:pointer">开始游戏</button>
  </div>

  <!-- Controls (hidden until game starts) -->
  <div id="controls" style="display:none">
    <div id="message"></div>
    <div id="buttons">
      <button id="btn-play" onclick="playCards()">出牌</button>
      <button id="btn-pass" onclick="passTurn()">过</button>
      <button id="btn-hint" onclick="showHint()">提示</button>
      <button id="btn-organize" onclick="organizeCombo()">组牌</button>
      <button id="btn-layout" onclick="toggleLayout()">横排</button>
      <button id="btn-new-round" onclick="newRound()" style="display:none">下一局</button>
    </div>
    <div id="buttons-ai" style="margin-top:4px;display:flex;align-items:center">
      <div style="flex:1"></div>
      <div style="display:flex;gap:8px">
        <button id="btn-suggest" onclick="aiSuggest()" style="background:#8e44ad">AI决策</button>
        <button id="btn-evaluate" onclick="aiEvaluate()" style="background:#2c3e50">AI评估</button>
        <button id="btn-auto-play" onclick="toggleAutoPlay()" style="background:#555">自动对局</button>
      </div>
      <div style="flex:1;display:flex;justify-content:flex-end">
        <button id="btn-new-game" onclick="newGame()">新游戏</button>
      </div>
    </div>
  </div>

  <!-- AI Debug Panel -->
  <div id="ai-debug-panel">
    <div id="ai-debug-header">
      <h3>AI 决策日志</h3>
      <button id="btn-ai-clear" onclick="clearAILog()">清空</button>
      <button id="btn-ai-close-panel" onclick="toggleAIDebug()">关闭</button>
    </div>
    <div id="ai-debug-content"></div>
  </div>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <h3>战绩</h3>
    <div id="history"></div>
  </div>
</div>

<script src="/static/lib/constants.js"></script>
<script src="/static/lib/card.js"></script>
<script src="/static/lib/api.js"></script>
<script>window.__INITIAL_STATE__ = {{ initial_state|safe }};</script>
<script src="/static/game.js"></script>
</body>
</html>
